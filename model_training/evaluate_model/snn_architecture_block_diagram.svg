<svg width="2000" height="1000" viewBox="0 0 2000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #4f5d75; }
      .section { font: 700 20px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1f2a44; }
      .label { font: 700 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #14213d; }
      .body { font: 500 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #24324a; }
      .small { font: 500 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #52627a; }
      .mono { font: 600 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #23324a; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b132b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a506b"/>
    </marker>
  </defs>

  <rect width="2000" height="1000" fill="#f7f8fc"/>

  <text x="72" y="76" class="title">Trained SNN Decoder Architecture</text>
  <text x="72" y="108" class="subtitle">Brain-to-text phoneme decoder used in run 2026-04-02_20-48-23_266921_snn_pid238600</text>

  <rect x="60" y="146" width="1880" height="820" rx="28" fill="#ffffff" stroke="#d7ddea" stroke-width="2"/>

  <text x="92" y="196" class="section">Sequence-level data flow</text>

  <rect x="96" y="250" width="180" height="130" rx="20" fill="#E9F2FF" stroke="#8CB8FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="122" y="292" class="label">Neural input</text>
  <text x="122" y="322" class="mono">[B, T, 512]</text>
  <text x="122" y="348" class="small">512 neural features</text>

  <rect x="338" y="232" width="238" height="170" rx="20" fill="#FFF4DB" stroke="#F5BE5C" stroke-width="2" filter="url(#shadow)"/>
  <text x="366" y="274" class="label">Day-specific alignment</text>
  <text x="366" y="304" class="body">Per-session affine transform</text>
  <text x="366" y="332" class="mono">W_day: 512 x 512</text>
  <text x="366" y="356" class="mono">b_day: 1 x 512</text>
  <text x="366" y="380" class="body">Softsign + dropout 0.2</text>

  <rect x="642" y="250" width="220" height="130" rx="20" fill="#E8FBF5" stroke="#58C6A9" stroke-width="2" filter="url(#shadow)"/>
  <text x="672" y="294" class="label">Temporal patching</text>
  <text x="672" y="326" class="body">patch size = 4</text>
  <text x="672" y="354" class="body">stride = 4</text>

  <rect x="918" y="250" width="246" height="130" rx="20" fill="#F3ECFF" stroke="#B391F0" stroke-width="2" filter="url(#shadow)"/>
  <text x="946" y="294" class="label">Input projection</text>
  <text x="946" y="326" class="mono">2048 -&gt; 384</text>
  <text x="946" y="354" class="body">Linear embedding</text>

  <rect x="1240" y="214" width="348" height="280" rx="24" fill="#FDEBEC" stroke="#E58C94" stroke-width="2" filter="url(#shadow)"/>
  <text x="1272" y="262" class="label">Residual SNN core x4</text>
  <text x="1272" y="298" class="body">Each block keeps hidden size 384</text>
  <rect x="1272" y="328" width="274" height="76" rx="14" fill="#ffffff" stroke="#F0B8BE" stroke-width="1.5"/>
  <text x="1292" y="358" class="body">LaggedMixer over lags</text>
  <text x="1292" y="387" class="mono">{0,1,2,3,4,5,6,7}</text>
  <rect x="1272" y="420" width="274" height="62" rx="14" fill="#ffffff" stroke="#F0B8BE" stroke-width="1.5"/>
  <text x="1292" y="458" class="body">LTLIF spike neuron</text>

  <rect x="1668" y="232" width="186" height="178" rx="20" fill="#EAF0FF" stroke="#93A9E8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1696" y="280" class="label">Readout MLP</text>
  <text x="1696" y="316" class="mono">384 -&gt; 384</text>
  <text x="1696" y="346" class="body">GELU + drop 0.1</text>
  <text x="1696" y="378" class="mono">384 -&gt; 41</text>

  <rect x="1650" y="528" width="254" height="136" rx="20" fill="#EDF7ED" stroke="#8ECF91" stroke-width="2" filter="url(#shadow)"/>
  <text x="1684" y="576" class="label">Phoneme logits</text>
  <text x="1684" y="612" class="mono">[B, T', 41]</text>
  <text x="1684" y="642" class="body">CTC loss / decoding</text>

  <line x1="276" y1="309" x2="338" y2="309" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="576" y1="309" x2="642" y2="309" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="862" y1="309" x2="918" y2="309" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1164" y1="309" x2="1240" y2="309" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1588" y1="321" x2="1668" y2="321" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1761" y1="410" x2="1761" y2="528" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="686" y="222" class="small">concatenate 4 consecutive frames</text>
  <text x="936" y="222" class="small">flattened patch token: 4 x 512 = 2048</text>

  <text x="92" y="530" class="section">Internal structure of one residual SNN block</text>

  <rect x="96" y="570" width="350" height="340" rx="24" fill="#FDEBEC" stroke="#E58C94" stroke-width="2"/>
  <text x="126" y="614" class="label">Input hidden state</text>
  <text x="126" y="646" class="mono">h[t] in R^384</text>
  <path d="M126 680 H266" stroke="#D65A67" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M126 856 H326 V808" stroke="#D65A67" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <circle cx="326" cy="786" r="22" fill="#ffffff" stroke="#D65A67" stroke-width="3"/>
  <text x="318" y="793" class="label">+</text>
  <text x="126" y="888" class="body">Residual skip adds block output back</text>

  <rect x="500" y="570" width="220" height="124" rx="18" fill="#ffffff" stroke="#F0B8BE" stroke-width="2"/>
  <text x="530" y="610" class="label">LaggedMixer</text>
  <text x="530" y="644" class="body">mixes current and</text>
  <text x="530" y="670" class="body">7 previous hidden states</text>

  <rect x="788" y="570" width="244" height="156" rx="18" fill="#ffffff" stroke="#F0B8BE" stroke-width="2"/>
  <text x="818" y="610" class="label">LTLIF neuron</text>
  <text x="818" y="644" class="mono">tau = 5.0</text>
  <text x="818" y="672" class="mono">threshold = 0.75</text>
  <text x="818" y="700" class="mono">reset = 0.0</text>

  <rect x="1100" y="570" width="216" height="124" rx="18" fill="#ffffff" stroke="#F0B8BE" stroke-width="2"/>
  <text x="1128" y="610" class="label">Linear</text>
  <text x="1128" y="644" class="mono">384 -&gt; 384</text>
  <text x="1128" y="670" class="body">channel mixing</text>

  <rect x="1080" y="760" width="216" height="124" rx="18" fill="#ffffff" stroke="#F0B8BE" stroke-width="2"/>
  <text x="1108" y="800" class="label">BatchNorm</text>
  <text x="1108" y="834" class="body">stabilizes hidden</text>
  <text x="1108" y="860" class="body">spike representation</text>

  <rect x="820" y="760" width="142" height="124" rx="18" fill="#ffffff" stroke="#F0B8BE" stroke-width="2"/>
  <text x="848" y="800" class="label">Dropout</text>
  <text x="848" y="834" class="body">p = 0.0</text>

  <line x1="446" y1="622" x2="500" y2="622" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="720" y1="622" x2="788" y2="622" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1032" y1="622" x2="1100" y2="622" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1208" y1="694" x2="1208" y2="760" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1080" y1="822" x2="962" y2="822" stroke="#3a506b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 822 H380 V786 H348" stroke="#3a506b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="92" y="932" class="subtitle">Key sizes: input 512, patch embedding 2048, hidden spiking state 384, output 41 phoneme classes.</text>
</svg>
