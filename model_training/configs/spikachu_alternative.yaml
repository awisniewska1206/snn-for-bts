experiment_tag: "SpikingJelly_snn_hybrid"

seed: 42
wandb_mode: "disabled"

model:
  type: "SpikingJellySNN"
  enable_benchmarking: True
  setup:
    surrogate: "atan"
    backend: "cupy"
    input_size: 512
    hidden_size: 384
    output_size: 41
    patch_size: 4
    patch_stride: 4

    snn_core:
      tau: 5.0
      v_threshold: 0.75
      v_reset: 0.0
      n_blocks: 4
      p_drop: 0.0
      lagged_lags: [0, 1, 2, 3, 4, 5, 6, 7]
      lagged_one_random_lag_per_pair: true

save_path: "logs/"
